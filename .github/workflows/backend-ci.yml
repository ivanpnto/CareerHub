name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: careerhub
          POSTGRES_USER: careerhub
          POSTGRES_PASSWORD: careerhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DB_URL: jdbc:postgresql://localhost:5432/careerhub
      DB_USERNAME: careerhub
      DB_PASSWORD: careerhub

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate JWT secret for tests
        run: |
          secret=$(openssl rand -base64 32)
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./mvnw -B verify